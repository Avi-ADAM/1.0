<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מה הצעד הבא?</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Sababa'; src: url('../../../static/fonts/NbmSababaHL1-Bold.otf'); }
  :root {
    --barbi: #ff0092; --gold: #fbbf24; --green: #34d399;
    --night: #0f0b24; --night2: #1d1442; --panel: #171233; --line: #2f2760; --muted: #9b93c9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
  body { font-family: 'Heebo', sans-serif; color: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 30%, var(--night2), var(--night)); }
  .layer { position: absolute; inset: 0; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .w { display: inline-block; opacity: 0; white-space: pre; }

  /* S1: an idea, nothing else */
  #bulb { font-size: 260px; line-height: 1; }
  #i1 { font-size: 110px; font-weight: 900; margin-top: 40px; }
  #nos { display: flex; gap: 30px; margin-top: 70px; }
  .no { padding: 22px 44px; border-radius: 50px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.16); font-size: 52px; font-weight: 700; color: #d7cff9; opacity: 0; }
  .no s { text-decoration-color: var(--barbi); text-decoration-thickness: 6px; }
  #i2 { font-size: 92px; font-weight: 900; color: var(--barbi); margin-top: 90px; }

  /* S2: write it, it breaks down, people offer */
  #s2 { opacity: 0; }
  #page { position: absolute; top: 110px; width: 100%; text-align: center; font-size: 44px; color: var(--muted); font-weight: 700; }
  #page b { color: #fff; }
  #box { position: absolute; top: 200px; left: 90px; width: 900px; height: 400px; border-radius: 44px; background: #fff; color: #1a1333; padding: 46px 52px;
    box-shadow: 0 30px 90px rgba(0,0,0,.5); }
  #box .ph { font-size: 32px; color: #8b84a8; font-weight: 700; }
  #typed { font-size: 52px; font-weight: 700; line-height: 1.35; margin-top: 16px; min-height: 210px; }
  #caret { display: inline-block; width: 5px; height: 56px; background: var(--barbi); vertical-align: -10px; margin-right: 4px; }
  #send { position: absolute; bottom: 30px; left: 40px; padding: 16px 40px; border-radius: 40px; background: var(--barbi); color: #fff; font-size: 38px; font-weight: 800; }
  #grid { position: absolute; top: 700px; left: 90px; width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .pc { border-radius: 36px; background: var(--panel); border: 2px solid var(--line); padding: 30px 32px; height: 400px; position: relative; opacity: 0; }
  .pc .k { display: inline-block; padding: 6px 22px; border-radius: 30px; font-size: 28px; font-weight: 800; }
  .pc .k.m { background: rgba(255,0,146,.18); color: #ff6cbc; }
  .pc .k.r { background: rgba(251,191,36,.18); color: var(--gold); }
  .pc .ic { font-size: 60px; margin-top: 12px; }
  .pc .t { font-size: 44px; font-weight: 800; margin-top: 6px; line-height: 1.15; }
  .of { position: absolute; bottom: 26px; right: 26px; left: 26px; display: flex; align-items: center; gap: 16px; padding: 12px 14px; border-radius: 26px;
    background: #fff; color: #1a1333; opacity: 0; }
  .of .a { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; flex: none; }
  .of .x { white-space: nowrap; font-size: 25px; font-weight: 800; line-height: 1.2; }
  .of .x small { display: block; font-size: 24px; color: #6b6290; font-weight: 500; }
  #lines { position: absolute; top: 600px; left: 90px; width: 900px; height: 100px; }

  /* S3: the point + brand */
  #s5 { background: radial-gradient(110% 70% at 50% 40%, #3a1257, var(--night)); opacity: 0; }
  #p1 { font-size: 88px; font-weight: 900; }
  #p2 { font-size: 88px; font-weight: 900; color: var(--barbi); margin-top: 20px; line-height: 1.2; }
  #mark { font-family: 'Sababa', 'Heebo'; font-size: 220px; direction: ltr; letter-spacing: 4px; margin-top: 90px; opacity: 0; }
  #mark .h { color: var(--barbi); display: inline-block; }
  #cta { margin-top: 50px; padding: 30px 80px; border-radius: 90px; background: var(--barbi); font-size: 60px; font-weight: 800;
    box-shadow: 0 0 60px rgba(255,0,146,.55); opacity: 0; }
  #cta span { direction: ltr; display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <!-- S1 -->
  <div class="layer center" id="s1">
    <div id="bulb">💡</div>
    <div id="i1">יש לך רעיון.</div>
    <div id="nos"><div class="no">אין <s>כסף</s></div><div class="no">אין <s>ידע</s></div></div>
    <div id="i2">מה הצעד הבא?</div>
  </div>

  <!-- S2 -->
  <div class="layer" id="s2">
    <div id="page">בעמוד <b>"נעשה בשבילך"</b> ב-1lev1</div>
    <div id="box">
      <div class="ph">מה היית רוצה שיקרה?</div>
      <div id="typed"><span id="tx"></span><span id="caret"></span></div>
      <div id="send">שליחה</div>
    </div>
    <svg id="lines" viewBox="0 0 900 100"></svg>
    <div id="grid"></div>
  </div>

  <!-- S3 -->
  <div class="layer center" id="s5">
    <div id="p1">לא צריך לדעת הכול.</div>
    <div id="p2">צריך למצוא<br>את מי שיודע.</div>
    <div id="mark">1<span class="h">lev</span>1</div>
    <div id="cta">נעשה בשבילך · <span>1lev1.com</span></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, s, d) => cl((t - s) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .35) => Math.min(eo(p(t, a, f)), 1 - p(t, b - f, f));
function split(el) {
  el.innerHTML = el.textContent.split(/(\s+)/).filter(Boolean)
    .map(s => /^\s+$/.test(s) ? s : `<span class="w">${s}</span>`).join('');
}
['i1', 'i2', 'p1'].forEach(id => split($(id)));
function words(el, t, start, per, dy = 34) {
  el.querySelectorAll('.w').forEach((w, i) => {
    const q = eo(p(t, start + i * per, .3));
    w.style.opacity = q; w.style.transform = `translateY(${(1 - q) * dy}px)`;
  });
}
const fadeIn = (el, t, s, d = .4, dy = 30) => { const q = eo(p(t, s, d)); el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * dy}px)`; return q; };
const popIn = (el, t, s, d = .45) => { const q = p(t, s, d); el.style.opacity = Math.min(1, q * 3); el.style.transform = `scale(${q === 0 ? .4 : back(q)})`; return q; };

const WISH = 'אני רוצה לפתוח עגלת קפה בשכונה, ואין לי מושג מאיפה מתחילים.';
// what the wish breaks into, and who offers to take each part
const PARTS = [
  ['m', 'משימה', '🎨', 'עיצוב שם ולוגו', '👩🏻‍🎨', '#ffd1ea', 'מיכל מציעה את עצמה', 'מעצבת, 8 שנים'],
  ['m', 'משימה', '🪚', 'בניית העגלה', '🧔🏽', '#fde68a', 'אבי מציע את עצמו', 'נגר'],
  ['m', 'משימה', '📋', 'רישוי עסק', '👨🏻‍💼', '#bae6fd', 'דן מציע את עצמו', 'יועץ רישוי'],
  ['r', 'משאב', '☕', 'מכונת אספרסו', '👩🏾', '#bbf7d0', 'יעל: יש לי אחת', 'מביאה אותה לרקמה'],
];
$('grid').innerHTML = PARTS.map(([c, k, ic, t, e, bg, who, sub]) =>
  `<div class="pc"><span class="k ${c}">${k}</span><div class="ic">${ic}</div><div class="t">${t}</div>
   <div class="of"><div class="a" style="background:${bg}">${e}</div><div class="x">${who}<small>${sub}</small></div></div></div>`).join('');
// threads from the wish down to each card
$('lines').innerHTML = [675, 225, 675, 225].slice(0, 2).map(x =>
  `<path d="M450 0 C450 60 ${x} 40 ${x} 100" stroke="#ff0092" stroke-width="5" fill="none" stroke-dasharray="1" stroke-dashoffset="1" pathLength="1" class="ln"/>`).join('');

const DURATION = 23.5;
window.DURATION = DURATION;
// narration: narrate.py (Adam / ElevenLabs v3); scenes timed to the words
window.AUDIO = [
  { src: 'assets/narration/n1.mp3', in: 0, dur: 5.84, at: 0.3 },
  { src: 'assets/narration/n2.mp3', in: 0, dur: 1.52, at: 6.8 },
  { src: 'assets/narration/n3.mp3', in: 0, dur: 2.16, at: 9.6 },
  { src: 'assets/narration/n4.mp3', in: 0, dur: 2.56, at: 12.0 },
  { src: 'assets/narration/n5.mp3', in: 0, dur: 5.84, at: 16.2 },
];

window.seek = function (t) {
  // ---------- S1 (0 - 6.7) ----------
  // n1 at 0.3: "יש לך רעיון, אבל אין לך כסף" 0.3–2.2 · "ואין לך ידע?" 2.7–3.6 · "מה הצעד הבא?" 4.1–6.1
  $('s1').style.opacity = 1 - eio(p(t, 6.3, .4));
  popIn($('bulb'), t, .2, .5);
  $('bulb').style.filter = `drop-shadow(0 0 ${30 + 20 * Math.sin(t * 4)}px rgba(251,191,36,.6))`;
  words($('i1'), t, .4, .25);
  document.querySelectorAll('.no').forEach((n, i) => {
    popIn(n, t, [1.6, 2.8][i], .35);
    n.querySelector('s').style.textDecorationLine = t > [1.95, 3.15][i] ? 'line-through' : 'none';
  });
  words($('i2'), t, 4.1, .45, 40);

  // ---------- S2 (6.6 - 16.0) ----------
  // n2 at 6.8: "כותבים אותו במילים שלך" 6.9–8.2 · n3 at 9.6: "הוא מתפרק למשימות ולמשאבים" 9.7–11.7
  // n4 at 12.0: "ואנשים שיודעים" 12.1–13.2 · "מציעים את עצמם" 13.5–14.4
  $('s2').style.opacity = win(t, 6.6, 16.05, .35);
  fadeIn($('page'), t, 6.7, .4, 10);
  fadeIn($('box'), t, 6.8, .45, 60);
  const n = Math.round(WISH.length * p(t, 7.1, 2.2));
  $('tx').textContent = WISH.slice(0, n);
  $('caret').style.opacity = t < 9.4 ? (Math.floor(t * 3) % 2 ? 1 : .2) : 0;
  const press = t > 9.4 && t < 9.65 ? Math.sin((t - 9.4) / .25 * Math.PI) : 0;
  $('send').style.transform = `scale(${1 - .08 * press})`;
  document.querySelectorAll('.ln').forEach(l => l.setAttribute('stroke-dashoffset', 1 - eio(p(t, 9.7, .5))));
  document.querySelectorAll('.pc').forEach((c, i) => {
    const q = p(t, 9.9 + i * .4, .45);
    c.style.opacity = Math.min(1, q * 3);
    c.style.transform = `translateY(${(1 - eo(q)) * -120}px) scale(${q === 0 ? .6 : .6 + .4 * back(q)})`;
    const o = c.querySelector('.of');
    const oq = p(t, 13.3 + i * .35, .4);
    o.style.opacity = Math.min(1, oq * 3);
    o.style.transform = `translateY(${(1 - eo(oq)) * 60}px)`;
    c.style.borderColor = oq > 0 ? `rgba(52,211,153,${eo(oq)})` : '';
  });

  // ---------- S3 (16.0 - 23.5) ----------
  // n5 at 16.2: "לא צריך לדעת הכול" 16.2–17.4 · "צריך למצוא את מי שיודע" 17.9–19.5 · "אחד-לב-אחד" 20.0–22.0
  $('s5').style.opacity = eo(p(t, 15.9, .35));
  words($('p1'), t, 16.25, .3);
  fadeIn($('p2'), t, 17.9, .45, 40);
  const mq = p(t, 19.9, .45);
  $('mark').style.opacity = mq; $('mark').style.transform = `scale(${mq === 0 ? .5 : back(mq)})`;
  const beat = t > 20.5 ? 1 + .12 * Math.max(0, Math.sin((t - 20.5) * Math.PI * 1.6)) ** 6 : 1;
  document.querySelector('#mark .h').style.transform = `scale(${beat})`;
  const ctq = fadeIn($('cta'), t, 21.0, .4);
  if (ctq >= 1) $('cta').style.transform = `scale(${1 + .04 * Math.sin((t - 21.4) * 6)})`;
};

const qs = new URLSearchParams(location.search);
if (!qs.has('render')) {
  document.fonts.ready.then(() => {
    if (qs.has('t')) return window.seek(+qs.get('t'));
    const t0 = performance.now();
    const loop = () => { window.seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
</html>
