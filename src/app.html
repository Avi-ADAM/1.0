<!DOCTYPE html>
<html lang=%lang% class="%themeclass%">
  <head>
    <!-- charset first: the spec only guarantees it is honoured inside the first
         1024 bytes, and the anti-flash script below is bigger than that. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv='content-language' content='%cl%'>
    <!-- No site-wide robots meta. "index, follow" is what a crawler does with
         no tag at all, so the tag only ever asserted the default - while
         sitting above the head slot below, where a page that needs `noindex`
         (a draft, a thin page) could not replace it, leaving two conflicting
         directives in one head. Pages that need to opt out declare their own.

         Do NOT name the head placeholder in any comment that sits ABOVE the
         real one: the substitution replaces the first occurrence in the file,
         so a mention here consumes it. The rendered head then lands inside
         this comment - its own SSR markers close the comment early, spilling
         the rest of this text onto the page - and the real slot further down
         survives as literal text. The two comments that name it further down
         are safe only because they come after it. -->
    <meta name="theme-color" content="#EEE8AA">
    %upgradeInsecure%

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // מניעת flash של עיצוב לא נכון.
  // hooks.server.js already stamps the class onto <html>, so this only has
  // real work to do for mode:"system" — the server cannot know the visitor's
  // OS preference. Runs before first paint, so there is still no flash.
  // It writes CSS classes only; the palette itself lives in app.postcss.
  (function () {
    try {
      var read = function (name) {
        var hit = document.cookie
          .split('; ')
          .filter(function (row) { return row.indexOf(name + '=') === 0; })[0];
        return hit ? decodeURIComponent(hit.slice(name.length + 1)) : '';
      };

      // `?theme=` beats the cookie and is written back to it, so a shared
      // link keeps its look for the rest of the visit. hooks.server.js does
      // the same on the server; this copy covers the renders it never sees
      // (prerendered/cached HTML, bfcache restores). Keep the spellings in
      // step with src/lib/theme/themeParam.js.
      var aliases = {
        personal: 'personal', default: 'personal', classic: 'personal',
        business: 'business', professional: 'business',
        proffesional: 'business', pro: 'business'
      };
      // hasOwnProperty: a bare lookup would resolve `?theme=constructor` to a
      // function off Object.prototype and hand it to classList.add().
      var alias = function (raw) {
        var key = String(raw || '').trim().toLowerCase();
        return Object.prototype.hasOwnProperty.call(aliases, key) ? aliases[key] : '';
      };
      var fromUrl = '';
      try {
        fromUrl = alias(new URLSearchParams(window.location.search).get('theme'));
      } catch (e) {}

      var theme = fromUrl || alias(read('theme')) || 'personal';
      if (fromUrl) {
        document.cookie =
          'theme=' + fromUrl + '; path=/; max-age=31536000; SameSite=Lax';
      }

      var mode = read('mode');
      if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';

      var dark =
        mode === 'dark' ||
        (mode === 'system' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);

      var root = document.documentElement;
      root.classList.remove('personal', 'business');
      root.classList.add(theme);
      root.classList.toggle('dark', dark);
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-mode', dark ? 'dark' : 'light');
      root.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {
      // A themeless render is still readable — never block the page on this.
      console.warn('Theme initialization failed:', e);
    }
  })();
</script>

    <link rel="manifest" href="%manifest%">
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon"
      href="https://res.cloudinary.com/love1/image/upload/v1645647192/apple-touch-icon_irclue.png">
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-status-bar-style' content='black'>

    <!-- The site serves every locale from the same URLs and picks one from
         `?lang=` / cookie / Accept-Language, so the alternates are query
         variants and x-default is the bare address (Hebrew, the default).
         Built per request in hooks.server.js from the path being served: as
         six literal tags they named the homepage on all ~90 pages, so every
         inner page told crawlers its translations lived at "/". -->
%hreflang%

    <meta property="og:url" content="%canonical%" />
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@IOHTFzdIGHgPhoZ">
    <meta name="twitter:creator" content="@IOHTFzdIGHgPhoZ">

    <script type="application/ld+json">

    <!-- What the product actually is. Organization above says who publishes
         the site; this says the site IS a piece of software, which is the
         entity a "partnership management" search is looking for. -->

      {

      "description": "Run a partnership without a boss: publish open missions and resources, log hours and contributed resources, decide by consensus, and split profits transparently in proportion to what each partner actually contributed.",

      }

    </script>

    %sveltekit.head%

    <!--
      Site-wide fallbacks. They sit AFTER %sveltekit.head% on purpose: a page
      that declares its own title/description/og/canonical in svelte:head then
      owns the first such tag in the document, and browsers and crawlers alike
      take the first one they meet. Anything a page leaves undeclared falls
      through to the values below — which is how the ~13 public pages that
      never set a canonical get a self-referencing one, and how the five that
      set no title at all stopped sharing the homepage's. Moving this block above %sveltekit.head% would stamp
      the homepage title onto all ~90 pages that set their own.
      (Written without literal tag syntax: a tag name spelled out here, even
      inside a comment, turns up when the raw HTML is grepped for it.)
    -->
    <link rel="canonical" href="%canonical%" />
    <title>%title%</title>
    <meta name="description" content="%desc%">
    <meta property="og:title" content="%xtitle%" />
    <meta property="og:description" content="%desci%" />
    <meta property="og:image" content="https://res.cloudinary.com/love1/image/upload/v1640020897/cropped-PicsArt_01-28-07.49.25-1_wvt4qz.png" />
    <meta name="twitter:title" content="%xtitle%">
    <meta name="twitter:description" content="%xdes%">
    <meta name="twitter:image"
      content="https://res.cloudinary.com/love1/image/upload/v1640020897/cropped-PicsArt_01-28-07.49.25-1_wvt4qz.png">
  </head>
  <body>
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
