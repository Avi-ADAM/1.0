# SvelteKit API instance — runs on the Linux VPS next to Strapi.
# Deployed by deploy-api.ps1 (image built locally, pushed to GHCR and pulled
# here — or shipped with docker save/load via -Tarball; no `build:` on purpose).
# Private GHCR package: run `docker login ghcr.io` once on the server so
# `docker compose pull` can fetch it. Needs the compose v2 plugin (`docker
# compose`); the old v1 `docker-compose` is no longer supported here.
#
# The API runs as TWO colours, sveltekit-api-a and sveltekit-api-b, of which
# only one is up between deploys (docs/inprogress/PLAN_VPS_ONLY.md V2). Both
# carry the network alias `sveltekit-api`, so nginx (`set $api_backend
# "sveltekit-api:3000"`, re-resolved every 10s) and the scheduler reach
# whichever one is live with no change on their side. A deploy starts the
# other colour, waits for it to answer, lets nginx's DNS cache see both, and
# only then stops the old one: there is always at least one container behind
# the alias. Each colour sits in its own compose profile, so a bare
# `docker compose up -d` never starts the second one by accident.
#
# Expected layout on the server (default: /home/ubuntu/api — ubuntu, not root):
#   docker-compose.api.yml   <- this file (pushed by the script)
#   vector.toml              <- log-shipper config (pushed by the script)
#   .env                     <- runtime env, lives ONLY on the server:
#                               STRAPI_URL=http://strapi:1337  (stable alias of the nginx
#                               container in the Strapi repo's compose: an internal
#                               listener balancing strapi-1..3, docs/inprogress/
#                               PLAN_VPS_ONLY.md V1 — it never moves on a deploy)
#                               ORIGIN=https://api.1lev1.com
#                               ADMINMONTHER=..., cookies secrets, etc.
#                               MASTRA_PG_PASSWORD=...   (postgres service, below)
#                               MASTRA_DB_URL=postgresql://mastra_user:<same>@postgres:5432/mastra
#                               AXIOM_TOKEN=xaat-...     (vector service, below)
#                               AXIOM_DATASET=vps-docker
#                               UMAMI_DB_PASSWORD=...    (umami service; same value as the
#                                                         `umami` role in postgres)
#                               UMAMI_APP_SECRET=...     (openssl rand -hex 32)
#                               UMAMI_2FA_KEY=...        (openssl rand -hex 32)
#
# Nothing here publishes a host port: nginx (app-nginx-1, the Strapi repo's
# compose) terminates TLS and reaches the API over app-network. The old
# `127.0.0.1:3000:3000` mapping is gone because two colours cannot both bind it.
# See docs/done/PLAN_PROXY_SECURITY.md stage 3 and docs/DEPLOY_API_DOCKER.md.

x-sveltekit-api: &sveltekit-api
    # API_TAG is the git sha deploy-api.ps1 just pushed, so the new colour runs
    # exactly that build and a rollback is a deploy of an older tag. A bare
    # `up` with no API_TAG falls back to :latest.
    image: ghcr.io/avi-adam/1lev1-sveltekit-api:${API_TAG:-latest}
    restart: unless-stopped
    # adapter-node drains open requests on SIGTERM (SHUTDOWN_TIMEOUT, 30s by
    # default); docker's own 10s would cut the long ones off mid-flight.
    stop_grace_period: 35s
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Every month boundary in the app is computed in LOCAL time — deliberately,
      # so a member's month is the month they live in (src/lib/recurring/
      # missionMonths.ts). The container has no timezone of its own, so without
      # this it runs in UTC and every boundary sits three hours early: work
      # logged late on the 1st is filed to the previous month, and a recurring
      # cycle opened at 00:00 Israel time reads as the *previous* month, so
      # `hasOpenCycleFor` misses it and /api/monthi opens a second cycle for a
      # month that already has one. Change it with the rikma, not per service.
      - TZ=${TZ:-Asia/Jerusalem}
      # adapter-node needs ORIGIN for correct CSRF/origin checks behind Nginx
      - ORIGIN=${ORIGIN:-https://api.1lev1.com}
      # The rikma library uploads land here as a single PUT (docs/
       # PLAN_RIKMA_SHARED_INFO.md stage 2), so this has to clear
       # SPACE_DOCS_MAX_MB (default 100MB) — and nginx's client_max_body_size
       # on api.1lev1.com, which is already 100M.
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-110M}
      # Where the rikma library keeps its files. Private: nothing serves this
      # directory — the only way in or out is a signed blob ticket checked by
      # /api/v1/space-docs/blob. Unset it and the library falls back to the
      # old Strapi/Cloudinary upload (public by URL).
      - SPACE_DOCS_DIR=${SPACE_DOCS_DIR:-/data/space-docs}
      # UGC translation state (docs/inprogress/PLAN_UGC_TRANSLATION.md §13):
      # the backfill cursor, the governor's daily quota counter and the guest
      # demand log. In the container's own filesystem every deploy would wipe
      # them — the backfill restarting from page 1 and the day's quota forgotten.
      - TRANSLATE_STATE_DIR=${TRANSLATE_STATE_DIR:-/data/translate-state}
    # /etc/docker/daemon.json sets the same caps globally, but only for
    # containers created AFTER a daemon restart — declaring it here means the
    # rotation is real from the next `up -d`, with no daemon bounce.
    logging: &json-log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # A named volume, not a bind mount: it survives `docker-compose down`,
      # image rebuilds and blue/green flips, and `docker run --rm -v` can copy
      # it out for a backup without touching the container.
      - space-docs:/data/space-docs
      - translate-state:/data/translate-state
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    networks:
      app-network:
        aliases:
          - sveltekit-api

services:
  sveltekit-api-a:
    <<: *sveltekit-api
    container_name: sveltekit-api-a
    profiles: ["a"]

  sveltekit-api-b:
    <<: *sveltekit-api
    container_name: sveltekit-api-b
    profiles: ["b"]

  # ---- The box's Postgres (docs/done/PLAN_MASTRA_STORAGE.md) ----
  # Started as Mastra's store; since the 2026-11 server move it also holds
  # Strapi's database (`tov`) and barbi's. Never published to a host port: only
  # containers on app-network can reach it, as `postgres:5432` /
  # `mastra-postgres:5432`.
  #
  # Sized for vps2 (6 vCPU, 11GB), docs/inprogress/PLAN_VPS_ONLY.md V0. The connection
  # budget is the part that breaks first: every Strapi replica holds a knex pool
  # of up to DATABASE_POOL_MAX (default 10), three replicas plus a rolling-deploy
  # spare are 40, and barbi, Mastra and psql need room beside them. 25 — the old
  # 1.9GB box's value — would refuse the third Strapi at boot.
  postgres:
    image: postgres:16-alpine
    container_name: mastra-postgres
    restart: unless-stopped
    # Parallel queries use dynamic shared memory in /dev/shm; docker's 64MB
    # default makes a big sort fail with "could not resize shared memory".
    shm_size: 256mb
    environment:
      - POSTGRES_DB=mastra
      - POSTGRES_USER=mastra_user
      - POSTGRES_PASSWORD=${MASTRA_PG_PASSWORD:?set MASTRA_PG_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
    volumes:
      - mastra-pgdata:/var/lib/postgresql/data
    logging: *json-log
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra_user -d mastra"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ---- Web analytics (Umami) ----
  # In-house replacement for Vercel Analytics, docs/tbd/PLAN_INHOUSE_ANALYTICS.md.
  # Cookieless (a session is a daily-salted hash of IP+UA), so it needs no
  # consent banner and is not a third party in the privacy page. It keeps its
  # data in its own `umami` database on the postgres service above — created
  # once by hand (plan §A0), never by this file.
  #
  # Reached only through nginx (pulse.1lev1.com, the Strapi repo's template),
  # which forwards X-Forwarded-For: without it every visitor geolocates to the
  # proxy and the country breakdown is meaningless. No host port.
  #
  # Pinned: Umami ships security fixes often (3.4.1 is one) — bump deliberately.
  #
  # Own profile, and `:-` (not `:?`) on its secrets: api-switch.sh runs compose
  # against this whole file on every API deploy, and a `:?` variable missing
  # from a server's .env would fail that deploy, not just this service. Start it
  # with `docker compose -f docker-compose.api.yml --profile analytics up -d umami`.
  umami:
    profiles: ["analytics"]
    image: ghcr.io/umami-software/umami:3.4.1
    container_name: umami
    restart: unless-stopped
    init: true
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-}@postgres:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET:-}
      - TWO_FACTOR_ENCRYPTION_KEY=${UMAMI_2FA_KEY:-}
      # The dashboard is ours only; nothing else should call home.
      - DISABLE_TELEMETRY=1
      - DISABLE_UPDATES=1
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || curl -fs http://127.0.0.1:3000/api/heartbeat >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *json-log
    networks:
      - app-network

  # ---- Log shipper -> Axiom ----
  # Vercel already drains into Axiom; this puts the VPS containers in the same
  # place. `docker_logs` reads every container on the box (api, nginx, Strapi,
  # socket-server), so crashes and nginx 5xx land there too — not just what the
  # app chose to log. Config in vector.toml, uploaded next to this file.
  #
  # NOTE: mounting docker.sock grants Vector full Docker API access. `:ro`
  # applies to the socket file, not to the API. That is the standard trade for
  # container-name metadata; the alternative is tailing the raw json logs and
  # losing the labels.
  vector:
    image: timberio/vector:0.57.0-alpine
    container_name: vector
    restart: unless-stopped
    # The image ships no /etc/vector at all and its default config path is
    # /etc/vector/vector.YAML — a bind-mounted .toml is silently never read and
    # the container crash-loops on "Config file not found". Point it at the file
    # explicitly. (Entrypoint is the vector binary itself, so this is argv.)
    command: ["--config", "/etc/vector/vector.toml"]
    # Vector 0.57 does NOT interpolate ${VAR} in config files unless this is on
    # (it was on by default in older releases). Without it the sink literally
    # POSTs to /v1/datasets/${AXIOM_DATASET}/ingest with `Bearer ${AXIOM_TOKEN}`
    # and Axiom answers 401 — which reads like a bad token and isn't.
    #
    # Deliberately NOT `env_file: .env`: that handed Vector every production
    # secret (OpenAI/Groq keys, admin tokens, DB passwords). With interpolation
    # enabled and docker.sock mounted, this container should see the two
    # variables it needs and nothing else. Compose reads ./.env for these.
    environment:
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
      - AXIOM_TOKEN=${AXIOM_TOKEN:?set AXIOM_TOKEN in .env}
      - AXIOM_DATASET=${AXIOM_DATASET:-vps-docker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
    logging: *json-log
    networks:
      - app-network

  # ---- Scheduler (scripts/scheduler/) ----
  # The clock the platform runs on: it matures timegramot, closes the month and
  # runs the daily batch. It lives here rather than in a host systemd unit
  # because this box has no node of its own — everything is docker — and because
  # travelling with the compose file is what makes moving servers a copy.
  #
  # It reaches the API over the internal network, so the job endpoints never
  # need to be exposed; `env_file` hands it ADMINMONTHER directly, so it does
  # not read a .env of its own. The script is bind-mounted (deploy-api.ps1
  # uploads it beside this file) — no image to rebuild to change a schedule.
  scheduler:
    image: node:22-alpine
    container_name: 1lev1-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      # Same reasoning as the API: the month it decides to close has to be the
      # month the members are living in.
      - TZ=${TZ:-Asia/Jerusalem}
      - SCHEDULER_BASE_URL=http://sveltekit-api:3000
      - SCHEDULER_STATE_FILE=/state/state.json
      # It gets its secrets from env_file; there is no .env inside this image.
      - SCHEDULER_ENV_FILE=/dev/null
    command: ["node", "/app/scheduler.mjs"]
    volumes:
      - ./scheduler.mjs:/app/scheduler.mjs:ro
      - scheduler-state:/state
    # No depends_on: the API is two profiled colours, and the scheduler only
    # needs the `sveltekit-api` alias to answer when a job is due — it retries
    # on its own clock, so a deploy in between costs nothing.
    logging: *json-log
    networks:
      - app-network

volumes:
  # The rikma libraries' files (docs/inprogress/PLAN_RIKMA_SHARED_INFO.md stage 2).
  # Back this up: unlike everything else on this box it is not derivable from
  # Strapi — losing it loses members' documents.
  #   docker run --rm -v api_space-docs:/d -v "$PWD":/b alpine \
  #     tar czf /b/space-docs-$(date +%F).tgz -C /d .
  space-docs:
  # Derivable (a lost cursor only restarts the walk), so no backup needed.
  translate-state:
  mastra-pgdata:
  vector-data:
  # What has already run — the record that stops a month being closed twice and
  # lets a box that was down on the 1st catch up when it comes back.
  scheduler-state:

networks:
  # Same external network the socket-server joins; put the Strapi container on
  # it too so STRAPI_URL=http://strapi:1337 resolves.
  # Create once on the server: docker network create app_app-network
  app-network:
    external: true
    name: app_app-network
