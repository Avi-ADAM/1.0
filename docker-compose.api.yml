# SvelteKit API instance — runs on the Linux VPS next to Strapi.
# Deployed by deploy-api.ps1 (image built locally, pushed to GHCR and pulled
# here — or shipped with docker save/load via -Tarball; no `build:` on purpose).
# Private GHCR package: run `docker login ghcr.io` once on the server so
# `docker-compose pull` can fetch it (this VPS has compose v1: `docker-compose`).
#
# Expected layout on the server (default: /home/ubuntu/api — ubuntu, not root):
#   docker-compose.api.yml   <- this file (pushed by the script)
#   vector.toml              <- log-shipper config (pushed by the script)
#   .env                     <- runtime env, lives ONLY on the server:
#                               STRAPI_URL=http://strapi:1337  (stable alias, always the
#                               active blue/green color — deploy.ps1 in the Strapi repo
#                               keeps it pointed correctly on every deploy, see below)
#                               ORIGIN=https://api.1lev1.com
#                               ADMINMONTHER=..., cookies secrets, etc.
#                               MASTRA_PG_PASSWORD=...   (postgres service, below)
#                               MASTRA_DB_URL=postgresql://mastra_user:<same>@postgres:5432/mastra
#                               AXIOM_TOKEN=xaat-...     (vector service, below)
#                               AXIOM_DATASET=vps-docker
#
# Strapi stays bound to 127.0.0.1 / the internal docker network — only this
# service and Nginx (TLS -> 127.0.0.1:3000) are reachable from outside.
# See docs/PLAN_PROXY_SECURITY.md stage 3 and docs/DEPLOY_API_DOCKER.md.

services:
  sveltekit-api:
    image: ghcr.io/avi-adam/1lev1-sveltekit-api:latest
    container_name: sveltekit-api
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Every month boundary in the app is computed in LOCAL time — deliberately,
      # so a member's month is the month they live in (src/lib/recurring/
      # missionMonths.ts). The container has no timezone of its own, so without
      # this it runs in UTC and every boundary sits three hours early: work
      # logged late on the 1st is filed to the previous month, and a recurring
      # cycle opened at 00:00 Israel time reads as the *previous* month, so
      # `hasOpenCycleFor` misses it and /api/monthi opens a second cycle for a
      # month that already has one. Change it with the rikma, not per service.
      - TZ=${TZ:-Asia/Jerusalem}
      # adapter-node needs ORIGIN for correct CSRF/origin checks behind Nginx
      - ORIGIN=${ORIGIN:-https://api.1lev1.com}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-50M}
    # /etc/docker/daemon.json sets the same caps globally, but only for
    # containers created AFTER a daemon restart — declaring it here means the
    # rotation is real from the next `up -d`, with no daemon bounce.
    logging: &json-log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # loopback only — Nginx terminates TLS and proxies to 127.0.0.1:3000
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # ---- Mastra persistence (docs/PLAN_MASTRA_STORAGE.md) ----
  # Strapi's Postgres is a managed Aiven service, NOT a container here, so
  # Mastra gets its own local instance. Never published to a host port: only
  # containers on app-network can reach it, as `postgres:5432`.
  # Tuned for the box, not for throughput — 1.9GB RAM total, shared with
  # Strapi, nginx, socket-server and the API. Postgres would otherwise size
  # its caches off the host's total RAM and push everything into swap.
  postgres:
    image: postgres:16-alpine
    container_name: mastra-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mastra
      - POSTGRES_USER=mastra_user
      - POSTGRES_PASSWORD=${MASTRA_PG_PASSWORD:?set MASTRA_PG_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=25
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - mastra-pgdata:/var/lib/postgresql/data
    logging: *json-log
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra_user -d mastra"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ---- Log shipper -> Axiom ----
  # Vercel already drains into Axiom; this puts the VPS containers in the same
  # place. `docker_logs` reads every container on the box (api, nginx, Strapi,
  # socket-server), so crashes and nginx 5xx land there too — not just what the
  # app chose to log. Config in vector.toml, uploaded next to this file.
  #
  # NOTE: mounting docker.sock grants Vector full Docker API access. `:ro`
  # applies to the socket file, not to the API. That is the standard trade for
  # container-name metadata; the alternative is tailing the raw json logs and
  # losing the labels.
  vector:
    image: timberio/vector:0.57.0-alpine
    container_name: vector
    restart: unless-stopped
    # The image ships no /etc/vector at all and its default config path is
    # /etc/vector/vector.YAML — a bind-mounted .toml is silently never read and
    # the container crash-loops on "Config file not found". Point it at the file
    # explicitly. (Entrypoint is the vector binary itself, so this is argv.)
    command: ["--config", "/etc/vector/vector.toml"]
    # Vector 0.57 does NOT interpolate ${VAR} in config files unless this is on
    # (it was on by default in older releases). Without it the sink literally
    # POSTs to /v1/datasets/${AXIOM_DATASET}/ingest with `Bearer ${AXIOM_TOKEN}`
    # and Axiom answers 401 — which reads like a bad token and isn't.
    #
    # Deliberately NOT `env_file: .env`: that handed Vector every production
    # secret (OpenAI/Groq keys, admin tokens, DB passwords). With interpolation
    # enabled and docker.sock mounted, this container should see the two
    # variables it needs and nothing else. Compose reads ./.env for these.
    environment:
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
      - AXIOM_TOKEN=${AXIOM_TOKEN:?set AXIOM_TOKEN in .env}
      - AXIOM_DATASET=${AXIOM_DATASET:-vps-docker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
    logging: *json-log
    networks:
      - app-network

  # ---- Scheduler (scripts/scheduler/) ----
  # The clock the platform runs on: it matures timegramot, closes the month and
  # runs the daily batch. It lives here rather than in a host systemd unit
  # because this box has no node of its own — everything is docker — and because
  # travelling with the compose file is what makes moving servers a copy.
  #
  # It reaches the API over the internal network, so the job endpoints never
  # need to be exposed; `env_file` hands it ADMINMONTHER directly, so it does
  # not read a .env of its own. The script is bind-mounted (deploy-api.ps1
  # uploads it beside this file) — no image to rebuild to change a schedule.
  scheduler:
    image: node:22-alpine
    container_name: 1lev1-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      # Same reasoning as the API: the month it decides to close has to be the
      # month the members are living in.
      - TZ=${TZ:-Asia/Jerusalem}
      - SCHEDULER_BASE_URL=http://sveltekit-api:3000
      - SCHEDULER_STATE_FILE=/state/state.json
      # It gets its secrets from env_file; there is no .env inside this image.
      - SCHEDULER_ENV_FILE=/dev/null
    command: ["node", "/app/scheduler.mjs"]
    volumes:
      - ./scheduler.mjs:/app/scheduler.mjs:ro
      - scheduler-state:/state
    depends_on:
      - sveltekit-api
    logging: *json-log
    networks:
      - app-network

volumes:
  mastra-pgdata:
  vector-data:
  # What has already run — the record that stops a month being closed twice and
  # lets a box that was down on the 1st catch up when it comes back.
  scheduler-state:

networks:
  # Same external network the socket-server joins; put the Strapi container on
  # it too so STRAPI_URL=http://strapi:1337 resolves.
  # Create once on the server: docker network create app_app-network
  app-network:
    external: true
    name: app_app-network
